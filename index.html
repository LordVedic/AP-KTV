@property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }

:root {
  /* Palette from a KTV song-selection screen: deep indigo-purple, glass panels, blue-violet pills, magenta-violet badges */
  --bg: #08050F;
  --glass: rgba(150, 130, 230, .16);
  --glass-line: rgba(200, 190, 255, .16);
  --surface: #1A1030;
  --line: rgba(200, 190, 255, .28);
  --text: #FFFFFF;
  --dim: #C4BBEA;
  --indigo: #4436EA;
  --violet: #9A36D0;
  --badge: linear-gradient(145deg, #B040E0, #8C34D6);
  --red: #D82F28;
  --lav: #D9D2FF;
  --sung: #C858F5;
  --danger: #FFB3A8;
  --ink: #140A33;
  --body: system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --display: "Fredoka", system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--body); position: relative; }
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 40% at 12% 0%, rgba(150, 90, 255, .16), transparent 70%),
    radial-gradient(50% 45% at 100% 12%, rgba(70, 60, 235, .18), transparent 70%),
    radial-gradient(70% 35% at 50% 100%, rgba(120, 50, 200, .12), transparent 70%),
    linear-gradient(180deg, #0D0819 0%, #08050F 100%);
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }

/* The karaoke-lyric treatment: white text that fills in as it is "sung" */
.lyric {
  display: inline-block; max-width: 100%; color: #fff;
  background: linear-gradient(90deg, var(--sung) var(--p), #fff var(--p));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  -webkit-filter: drop-shadow(0 2px 0 rgba(10, 4, 30, .5)); filter: drop-shadow(0 2px 0 rgba(10, 4, 30, .5));
}
.lyric.untracked { background: none; -webkit-text-fill-color: #fff; }

/* ---------- Landing ---------- */
.landing { max-width: 440px; margin: 0 auto; padding: 40px 20px 48px; position: relative; }
.landing h1 { font: 700 clamp(44px, 12vw, 64px)/1.1 var(--display); margin: 0 0 12px; --p: 100%; animation: sing 2.4s .3s ease-out both; }
@keyframes sing { from { --p: 0%; } to { --p: 100%; } }
.lead { font-size: 18px; color: var(--dim); margin: 0 0 28px; }
.stack { display: grid; grid-gap: 14px; gap: 14px; }
.field { display: grid; grid-gap: 6px; gap: 6px; font-size: 14px; color: var(--dim); font-weight: 500; }
input[type=text], input[type=password], input:not([type]) {
  width: 100%; min-height: 48px; padding: 10px 16px; border-radius: 14px;
  background: rgba(255, 255, 255, .07); border: 1.5px solid var(--glass-line); color: var(--text); font-size: 16px;
}
input::placeholder { color: #A79FD0; }
input:focus { border-color: var(--lav); outline: none; background: rgba(255, 255, 255, .11); }
.btn {
  min-height: 48px; padding: 10px 24px; border-radius: 999px; border: 1.5px solid transparent;
  font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
}
.btn.primary { background: var(--indigo); color: #fff; }
.btn.violet { background: var(--violet); color: #fff; }
.btn.ghost { background: var(--glass); border-color: var(--glass-line); color: var(--text); }
.btn.small { min-height: 36px; padding: 4px 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; align-items: center; margin: -5px; }
.row > * { margin: 5px; }
.hostbox { margin-top: 28px; border-top: 1px solid var(--glass-line); padding-top: 18px; }
.hostbox summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.hostbox .stack { margin-top: 12px; }
.hint { font-size: 13px; color: var(--dim); margin: 0; }
.err { color: var(--danger); font-weight: 500; margin: 16px 0 0; }
.langbtn { position: absolute; top: 14px; right: 16px; }
.langbtn, .langbtn2 { background: var(--glass); border: 1.5px solid var(--glass-line); border-radius: 999px; padding: 4px 14px; min-height: 36px; cursor: pointer; font-weight: 600; font-size: 14px; }

/* ---------- Room layout ---------- */
.app { max-width: 640px; margin: 0 auto; padding: 14px 16px 96px; display: grid; grid-gap: 18px; gap: 18px; }
body.stage-on .app { max-width: none; }
.bar { display: flex; align-items: center; }
.bar > * { margin-right: 10px; }
.grow { flex: 1; }
.chip { border: 1.5px solid var(--glass-line); background: var(--glass); border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 600; min-height: 40px; }
.chip b { font: 700 18px var(--display); letter-spacing: .06em; margin-left: 6px; }
.tag { font-size: 13px; font-weight: 700; background: var(--lav); color: var(--ink); border-radius: 999px; padding: 2px 10px; }
.linkbtn { background: none; border: 0; color: var(--dim); text-decoration: underline; cursor: pointer; padding: 8px; min-height: 40px; }
.conn { background: #4A1430; color: var(--danger); border-radius: 12px; padding: 8px 14px; font-size: 14px; }

.now { background: var(--badge); color: #fff; border-radius: 18px; padding: 16px 20px; }
.now.quiet { background: var(--glass); border: 1px solid var(--glass-line); }
.now-label { font-size: 14px; color: rgba(255, 255, 255, .85); font-weight: 600; }
.now.quiet .now-label, .now.quiet .now-sub { color: var(--dim); }
.now-title { font: 600 clamp(24px, 6vw, 32px)/1.25 var(--display); margin: 4px 0 2px; overflow-wrap: anywhere; }
.now-sub { font-size: 14px; color: rgba(255, 255, 255, .85); }

.hostbar { display: flex; flex-wrap: wrap; align-items: center; background: var(--glass); border: 1.5px dashed rgba(217, 210, 255, .4); border-radius: 16px; padding: 12px 14px; }
.hostbar.compact { background: none; border: 0; padding: 0; }
.hostbar p { margin: 0 12px 0 0; font-size: 14px; color: var(--dim); flex: 1 1 200px; }

.board { display: grid; grid-gap: 18px; gap: 18px; align-content: start; }
.reqform { display: grid; grid-gap: 10px; gap: 10px; }
.reqform h2, .qhead h2 { font: 600 22px var(--display); margin: 0; }
.qhead h2 { margin-right: 12px; }
.reqform .who { font-size: 13px; color: var(--dim); margin: 0; }

.qhead { display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.qhead > * { margin-right: 12px; }
.qhead .count { background: var(--red); color: #fff; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 1px 10px; }

/* song rows are glass panels with a round badge, like the song list on a KTV screen */
.queue, .hist { list-style: none; margin: 0; padding: 0; }
.song {
  display: grid; grid-template-columns: auto 1fr auto; grid-gap: 10px 12px; gap: 10px 12px; align-items: center;
  padding: 10px 12px 10px 10px; margin-bottom: 8px;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px;
}
.song.dragging { background: #2A1B5E; box-shadow: 0 10px 28px rgba(5, 2, 20, .55); position: relative; z-index: 2; }
.lead-cell { display: flex; align-items: center; }
.pos { width: 36px; height: 36px; border-radius: 50%; background: var(--badge); color: #fff; display: grid; place-items: center; font: 700 15px var(--display); flex: none; }
.grip { width: 28px; height: 44px; margin-right: 2px; display: grid; place-items: center; background: none; border: 0; color: var(--dim); cursor: grab; touch-action: none; border-radius: 8px; }
.song .title { font-weight: 600; overflow-wrap: anywhere; }
.song .sub { font-size: 13px; color: var(--dim); }
.song .sub > * + *::before { content: '|'; margin: 0 8px; opacity: .55; text-decoration: none; display: inline-block; }
.song .sub a { text-decoration: underline; text-underline-offset: 2px; }
.mine { color: #F0B4FF; font-weight: 600; }
.acts { display: flex; align-items: center; }
.acts > * { margin-left: 6px; }
.vote { display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid rgba(217, 210, 255, .45); background: transparent; cursor: pointer; font-weight: 600; }
.vote .ico { margin-right: 6px; }
.vote .ico svg path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.vote.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.vote.on .ico svg path { fill: currentColor; }
.iconbtn { width: 38px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: none; color: var(--dim); cursor: pointer; }
.iconbtn:hover { background: rgba(255, 255, 255, .1); color: var(--text); }
.ico svg { display: block; }
.ico svg path { stroke: currentColor; }

.empty { color: var(--dim); padding: 18px 0; margin: 0; }
details.history summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
.hist li { display: flex; align-items: center; padding: 10px 14px; margin-bottom: 8px; background: rgba(150, 130, 230, .08); border-radius: 14px; color: var(--dim); }
.hist li span { flex: 1; overflow-wrap: anywhere; margin-right: 12px; }

/* ---------- Player stage (host's TV / laptop) ---------- */
.stage { display: grid; grid-gap: 12px; gap: 12px; }
.screen { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 2px rgba(217, 210, 255, .3), 0 12px 40px rgba(5, 2, 20, .5); }
.screen > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.screen #yt { width: 100%; height: 100%; }
.idle, .fallback { display: grid; place-content: center; grid-gap: 14px; gap: 14px; text-align: center; padding: 20px; background: #06030C; font-size: 18px; }
.fallback p, .idle p { margin: 0 auto; max-width: 34ch; }
.lyricbar { min-height: 52px; }
.lyricbar .lyric { font: 700 clamp(24px, 4.2vw, 44px)/1.3 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.autorow { display: flex; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--dim); }
.autorow > * { margin: 4px 10px 4px 0; }

/* control bar: round icon over a label, like the bottom bar of a KTV screen */
.stagectl { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 14px 12px 12px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; }
.tile { display: flex; flex-direction: column; align-items: center; min-width: 92px; margin: 0 14px; padding: 0; background: none; border: 0; color: var(--text); cursor: pointer; }
.tile .ico { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, .85); margin-bottom: 6px; }
.tile .ico svg { width: 28px; height: 28px; }
.tile .ico svg path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile .tl { display: grid; line-height: 1.25; text-align: center; }
.tile b { font: 600 15px/1.25 var(--display); }
.tile small { font-size: 11px; color: var(--dim); font-weight: 500; }
.tile.start .ico { background: var(--indigo); border-color: var(--indigo); }
.tile.next .ico { background: var(--violet); border-color: var(--violet); }
.tile:disabled { opacity: .35; cursor: not-allowed; }
.nextline { flex: 1 1 100%; text-align: center; color: var(--dim); margin: 12px 0 0; overflow-wrap: anywhere; font-size: 14px; }
/* "Scan to join": QR code + message, top-left of the player screen */
.joinbox { display: flex; align-items: center; justify-self: start; }
.joinbox .qr { width: 112px; flex: none; margin-right: 14px; }
.qr { background: #fff; padding: 8px; border-radius: 12px; line-height: 0; width: 120px; }
.qr svg { width: 100%; height: auto; display: block; }
.joinbox p { margin: 0; color: var(--text); font-size: 15px; font-weight: 500; }
.joinbox b { font: 700 28px/1.2 var(--display); color: var(--text); letter-spacing: .08em; display: block; }
#hint { margin: 0; font-size: 13px; color: var(--dim); }

@media (min-width: 980px) {
  body.stage-on .app { max-width: none; grid-template-columns: 150px minmax(0, 1.7fr) minmax(340px, 1fr); align-items: start; grid-column-gap: 24px; column-gap: 24px; }
  body.stage-on .top, body.stage-on .hostbar, body.stage-on #conn { grid-column: 2 / -1; }
  body.stage-on .joinbox { grid-column: 1; grid-row: 1 / span 3; position: sticky; top: 16px; flex-direction: column; align-items: flex-start; }
  body.stage-on .joinbox .qr { width: 132px; margin: 0 0 10px; }
  body.stage-on .stage { grid-column: 2; position: sticky; top: 16px; }
  body.stage-on .board { grid-column: 3; }
}

/* ---------- Enlarged player: the screen fills the display ---------- */
body.big { overflow: hidden; }
body.big .stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 30; padding: 14px 18px; background: #05030C; display: flex; flex-direction: column; align-items: center; justify-content: center; }
body.big .stage > * + * { margin-top: 12px; }
body.big .stage { overflow: hidden; grid-gap: 0; gap: 0; }
body.big .stage > * { flex: none; }
body.big .screen { width: var(--bigW, 60vw); padding-top: 0; aspect-ratio: 16 / 9; }
body.big .lyricbar, body.big .stagectl, body.big .autorow, body.big #hint { width: 100%; max-width: 1000px; }
body.big .lyricbar { text-align: center; min-height: 0; }
body.big .lyricbar .lyric { font-size: clamp(28px, 4.4vw, 60px); }
body.big .autorow { justify-content: center; }
body.big .stagectl { flex-wrap: nowrap; justify-content: flex-start; align-items: center; padding: 8px 14px; }
body.big .tile { flex-direction: row; align-items: center; min-width: 0; margin: 0 14px 0 0; }
body.big .tile .ico { width: 44px; height: 44px; margin: 0 10px 0 0; }
body.big .tile .ico svg { width: 22px; height: 22px; }
body.big .tile .tl { text-align: left; }
body.big .nextline { flex: 1 1 0; min-width: 0; margin: 0 0 0 8px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.big .joinbox { display: none; }
body.big.join-fits .joinbox { display: flex; flex-direction: column; align-items: flex-start; position: fixed; top: 14px; left: 14px; z-index: 31; width: 140px; }
body.big.join-fits .joinbox .qr { width: 124px; margin: 0 0 8px; }
body.big.join-fits .joinbox b { font-size: 24px; }

/* ---------- Invite overlay & toast ---------- */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8, 3, 24, .8); display: grid; place-items: center; padding: 16px; z-index: 40; overflow-y: auto; }
.panel { background: var(--surface); border: 1px solid var(--glass-line); border-radius: 24px; padding: 24px; width: min(92vw, 380px); }
.panel h2 { font: 600 22px var(--display); margin: 0 0 12px; }
.panel .qr { margin: 8px auto 14px; width: 220px; }
.panel .code { font: 700 34px var(--display); letter-spacing: .12em; text-align: center; margin: 0 0 6px; }
.panel .link { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; text-align: center; margin: 0 0 12px; }
.panel .warn { font-size: 13px; color: var(--danger); margin: 0 0 12px; text-align: center; }
.panel select { width: 100%; min-height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .08); border: 1.5px solid var(--glass-line); color: var(--text); padding: 6px 10px; margin-bottom: 12px; font-size: 14px; }
.panel select option { color: #140A33; }
.panel .row { justify-content: center; }
#toast {
  position: fixed; left: 50%; bottom: 20px; -webkit-transform: translate(-50%, 20px); transform: translate(-50%, 20px);
  background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 999px; font-weight: 500;
  display: flex; align-items: center; max-width: min(92vw, 460px);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50;
}
#toast.show { opacity: 1; -webkit-transform: translate(-50%, 0); transform: translate(-50%, 0); pointer-events: auto; }
.toast-btn { background: none; border: 0; font-weight: 700; text-decoration: underline; cursor: pointer; color: var(--indigo); padding: 4px; margin-left: 14px; }

@media (prefers-reduced-motion: reduce) { .landing h1 { animation: none; } #toast { transition: none; } }
</style>
</head>
<body>

<!-- ================= LANDING ================= -->
<main id="landing" class="landing">
  <button class="langbtn" type="button" data-lang-toggle></button>
  <h1 class="lyric" data-i18n="appName"></h1>
  <p class="lead" data-i18n="lead"></p>

  <form id="joinForm" class="stack" autocomplete="off">
    <label class="field"><span data-i18n="roomCode"></span>
      <input id="inCode" maxlength="6" autocapitalize="characters" spellcheck="false" data-i18n-ph="roomCodePh">
    </label>
    <label class="field"><span data-i18n="yourName"></span>
      <input id="inName" maxlength="24" data-i18n-ph="yourNamePh">
    </label>
    <button class="btn primary" type="submit" data-i18n="join"></button>
  </form>

  <details id="hostBox" class="hostbox">
    <summary data-i18n="hosting"></summary>
    <div class="stack">
      <label class="field"><span data-i18n="hostPin"></span>
        <input id="inPin" type="password" maxlength="12" autocomplete="off" data-i18n-ph="hostPinPh">
      </label>
      <div class="row">
        <button id="createBtn" type="button" class="btn primary" data-i18n="create"></button>
        <button id="openHostBtn" type="button" class="btn ghost" data-i18n="openHost"></button>
      </div>
      <p class="hint" data-i18n="hostHint"></p>
    </div>
  </details>
  <p id="landErr" class="err" role="alert" hidden></p>
</main>

<!-- ================= ROOM ================= -->
<div id="room" class="app" hidden>
  <aside id="joinRail" class="joinbox" hidden>
    <div id="stageQr" class="qr"></div>
    <p><span data-i18n="scanJoin"></span><b id="stageCode"></b></p>
  </aside>
  <header class="top">
    <div class="bar">
      <button id="roomChip" class="chip" type="button"><span data-i18n="room"></span><b id="roomCode"></b></button>
      <span id="hostTag" class="tag" hidden data-i18n="hostTag"></span>
      <span class="grow"></span>
      <button class="langbtn2" type="button" data-lang-toggle></button>
      <button id="leaveBtn" class="linkbtn" type="button" data-i18n="leave"></button>
    </div>
  </header>

  <div id="conn" class="conn" hidden data-i18n="connLost"></div>

  <section id="now" class="now" aria-live="polite">
    <div class="now-label" data-i18n="nowLabel"></div>
    <div id="nowTitle" class="now-title"></div>
    <div id="nowSub" class="now-sub"></div>
  </section>

  <section id="hostbar" class="hostbar" hidden>
    <p data-i18n="hostbarText"></p>
    <button id="playerToggle" class="btn violet" type="button"></button>
  </section>

  <section id="stage" class="stage" hidden>
    <div class="screen">
      <div id="ytWrap" hidden><div id="yt"></div></div>
      <iframe id="bili" title="Bilibili" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
      <video id="vid" controls playsinline hidden></video>
      <div id="fallback" class="fallback" hidden>
        <p id="fbMsg"></p>
        <div class="row" style="justify-content:center">
          <a id="fbOpen" class="btn primary" target="_blank" rel="noopener" data-i18n="openLink"></a>
          <button id="fbNext" class="btn ghost" type="button" data-i18n="skipNext"></button>
        </div>
      </div>
      <div id="idle" class="idle"><p id="idleMsg"></p></div>
    </div>
    <div class="lyricbar"><span id="lyric" class="lyric untracked"></span></div>
    <p id="hint" hidden></p>
    <div id="autoRow" class="autorow" hidden>
      <span id="autoInfo"></span>
      <button id="autoPlus" class="btn ghost small" type="button" data-i18n="autoPlus"></button>
      <button id="autoRestart" class="btn ghost small" type="button" data-i18n="autoRestart"></button>
      <button id="autoToggle" class="btn ghost small" type="button"></button>
    </div>
    <div class="stagectl">
      <button id="startBtn" class="tile start" type="button"></button>
      <button id="stopBtn" class="tile stop" type="button" hidden></button>
      <button id="enlargeBtn" class="tile" type="button"></button>
      <p id="nextLine" class="nextline"></p>
    </div>
  </section>

  <section class="board">
    <form id="reqForm" class="reqform" autocomplete="off">
      <h2 data-i18n="reqTitle"></h2>
      <input id="reqTitleIn" maxlength="100" data-i18n-ph="songPh">
      <input id="reqLink" inputmode="url" autocapitalize="off" spellcheck="false" data-i18n-ph="linkPh">
      <p id="linkHint" class="hint"></p>
      <button class="btn primary" type="submit" data-i18n="addBtn"></button>
      <p class="who" id="whoLine"></p>
    </form>

    <div>
      <div class="qhead">
        <h2 data-i18n="upNext"></h2>
        <span id="qCount" class="count"></span>
        <span class="grow"></span>
        <button id="sortVotes" class="btn ghost small" type="button" hidden data-i18n="sortVotes"></button>
      </div>
      <ol id="queue" class="queue"></ol>
      <p id="qEmpty" class="empty" hidden data-i18n="qEmpty"></p>
    </div>

    <details id="history" class="history" hidden>
      <summary id="histSummary"></summary>
      <ul id="hList" class="hist"></ul>
    </details>
  </section>
</div>

<div id="invite" class="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="inviteTitle">
    <h2 id="inviteTitle" data-i18n="inviteTitle"></h2>
    <div id="inviteQr" class="qr"></div>
    <p class="code" id="inviteCode"></p>
    <p class="link" id="inviteLink"></p>
    <p class="warn" id="inviteWarn" hidden></p>
    <select id="lanSel" hidden aria-label=""></select>
    <p class="hint" id="inviteHint" style="text-align:center;margin-bottom:14px"></p>
    <div class="row">
      <button id="copyLink" class="btn primary" type="button" data-i18n="copyLink"></button>
      <button id="closeInvite" class="btn ghost" type="button" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

/* ---------- link parsing (hints only; the server re-checks) ---------- */
function parseLink(raw) {
  var s = (raw || '').trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  var u;
  try { u = new URL(s); } catch (e) { return null; }
  if (u.hostname.indexOf('.') < 0) return null;
  var host = u.hostname.replace(/^(www|m)\./, '');
  if (host === 'youtu.be' || /(^|\.)youtube(-nocookie)?\.com$/.test(host)) return { kind: 'youtube' };
  if (/(^|\.)bilibili\.com$/.test(host) || host === 'b23.tv') {
    if (/BV[0-9A-Za-z]{10}/.test(u.pathname + u.search) || /\/av\d+/i.test(u.pathname)) return { kind: 'bilibili' };
    if (host === 'b23.tv') return { kind: 'link', short: true };
  }
  if (/\.(mp4|webm|ogv|mov)$/i.test(u.pathname)) return { kind: 'file' };
  return { kind: 'link' };
}

/* ---------- API ---------- */
function api(path, body) {

  return fetch(path, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || 'error'); e.code = j.error || 'error'; throw e; }
      return j;
    });
  }, function () { var e = new Error('network'); e.code = 'network'; throw e; });
}

/* ---------- queue actions ---------- */

    .sort(function (a, b) { return (b.v - a.v) || (a.i - b.i); }).map(function (x) { return x.id; });

function gripKey(e, id) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  var ids = queueIds(); var i = ids.indexOf(id);
  var j = e.key === 'ArrowUp' ? i - 1 : i + 1;
  if (j < 0 || j >= ids.length) return;
  ids.splice(j, 0, ids.splice(i, 1)[0]);
  S.focusGrip = id;
  writeOrder(ids);
}

$('#queue').addEventListener('pointerdown', function (e) {
  var grip = e.target.closest ? e.target.closest('.grip') : null;
  if (!grip || !S.isHost) return;
  e.preventDefault();
  var list = $('#queue');
  var item = grip.closest('.song');
  S.dragging = true; item.classList.add('dragging');
  try { grip.setPointerCapture(e.pointerId); } catch (x) {}
  function move(ev) {
    var y = ev.clientY;
    if (y < 80) window.scrollBy(0, -14); else if (y > window.innerHeight - 80) window.scrollBy(0, 14);
    var before = null;
    var others = list.querySelectorAll('.song:not(.dragging)');
    for (var i = 0; i < others.length; i++) {
      var r = others[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) { before = others[i]; break; }
    }
    list.insertBefore(item, before);
  }
  function up() {
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', up);
    grip.removeEventListener('pointercancel', up);
    item.classList.remove('dragging');
    commitOrder();
  }
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
  grip.addEventListener('pointercancel', up);
});

  });
  return ytPromise;

      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) { var p2 = ex.call(document); if (p2 && p2.catch) p2.catch(function () {}); }
    }
  } catch (e) {}
  renderStageCtl();
  fitBig();
}
document.addEventListener('fullscreenchange', function () { if (S.big && !document.fullscreenElement) setBig(false); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.big) setBig(false); });

function fitBig() {
  if (!S.big) return;
  var st = $('#stage'), screen = st.querySelector('.screen'), used = 28;   // 28 = top + bottom padding
  [].forEach.call(st.children, function (k) { if (k !== screen && k.offsetHeight > 0) used += k.offsetHeight + 12; });
  var availH = window.innerHeight - used, availW = st.clientWidth - 36;
  var w = Math.max(240, Math.min(availW, Math.floor(availH * 16 / 9)));
  st.style.setProperty('--bigW', w + 'px');
  document.body.classList.toggle('join-fits', (st.clientWidth - w) / 2 >= 170);   // room beside the video for the QR
}
window.addEventListener('resize', fitBig);

function keepAwake() {
  try {
    if (navigator.wakeLock && !wake) {
      navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }, function () {});
    }
  } catch (e) {}
}

function showOnly(name) {
  ['yt', 'bili', 'vid', 'fb'].forEach(function (k) { el[k].hidden = k !== name; });
  el.idle.hidden = !!name;
}
function stopMedia(except) {
  if (except !== 'youtube') { try { if (PL.yt && PL.yt.stopVideo) PL.yt.stopVideo(); } catch (e) {} }
  if (except !== 'bilibili') el.bili.removeAttribute('src');
  if (except !== 'file') { try { el.vid.pause(); el.vid.removeAttribute('src'); el.vid.load(); } catch (e) {} }
}
function haltAll() { stopMedia(null); showOnly(null); setLyric(null); setHint(''); PL.auto = null; updateAutoRow(); }

function setLyric(text, tracked) {
  var l = $('#lyric');
  l.textContent = text || t('readyLyric');
  l.style.setProperty('--p', '0%');
  l.classList.toggle('untracked', !tracked);
}
function setHint(x) { var e = $('#hint'); e.textContent = x; e.hidden = !x; }
function showFallback(msg, s) { $('#fbMsg').textContent = msg; $('#fbOpen').href = s.url; showOnly('fb'); }

/* Bilibili can't tell us when a video ends, so we time it from the video's length */
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function startAuto(s) {
  if (s.kind === 'bilibili' && s.dur > 0) {
    var now = Date.now();
    PL.auto = { on: true, dur: s.dur, startAt: now, endAt: now + (s.dur + 3) * 1000 };
  } else PL.auto = null;
  updateAutoRow();
}
function updateAutoRow() {
  var row = $('#autoRow');
  row.hidden = !PL.auto;
  if (!PL.auto) return;
  $('#autoInfo').textContent = PL.auto.on ? t('autoInfo', { time: fmtTime((PL.auto.endAt - Date.now()) / 1000) }) : t('autoOffInfo');
  $('#autoToggle').textContent = PL.auto.on ? t('autoOff') : t('autoOn');
  $('#autoPlus').disabled = !PL.auto.on;
}

function playSong(id) {
  var s = S.byId[id]; if (!s) return;
  PL.current = id; PL.kind = s.kind;
  stopMedia(s.kind);
  setLyric(s.title, s.kind === 'youtube' || s.kind === 'file' || (s.kind === 'bilibili' && s.dur > 0));
  setHint(s.kind === 'bilibili' && !(s.dur > 0) ? t('hintBili') : s.kind === 'link' ? t('hintLink') : '');
  startAuto(s);

  if (s.kind === 'youtube') {
    showOnly('yt');
    ytApi().then(function () {
      if (PL.current !== id) return;
      if (!PL.yt) {
        var vars = { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 };
        if (location.protocol.indexOf('http') === 0) vars.origin = location.origin;
        PL.yt = new window.YT.Player('yt', {
          width: '100%', height: '100%', videoId: s.ref, playerVars: vars,
          events: {
            onReady: function (e) { try { e.target.playVideo(); } catch (x) {} },
            onStateChange: function (e) { if (e.data === 0 && PL.current === S.now) advance(); },
            onError: function (e) {
              var c = e.data;
              showFallback(t(c === 101 || c === 150 ? 'fbYtEmbed' : c === 100 ? 'fbYtGone' : 'fbYtErr'), S.byId[PL.current] || s);
            }
          }
        });
      } else PL.yt.loadVideoById(s.ref);
    }, function () { showFallback(t('fbYtLoad'), s); });
  } else if (s.kind === 'bilibili') {
    var q = [];
    if (/^av\d+$/i.test(s.ref)) q.push('aid=' + s.ref.slice(2)); else q.push('bvid=' + s.ref);
    q.push('page=' + (s.page || 1), 'autoplay=1', 'high_quality=1', 'danmaku=0');
    el.bili.src = 'https://player.bilibili.com/player.html?' + q.join('&');
    showOnly('bili');
  } else if (s.kind === 'file') {
    el.vid.src = s.url;
    el.vid.onended = function () { if (PL.current === S.now) advance(); };
    el.vid.onerror = function () { showFallback(t('fbFile'), s); };
    showOnly('vid');
    try { var pr = el.vid.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  } else {
    showFallback(t('fbLink'), s);
  }
}

function advance() {
  if (S.advancing || !S.room) return Promise.resolve();
  S.advancing = true; setTimeout(function () { S.advancing = false; scheduleRender(); }, 700);
  return post('/api/advance', {}).then(pull, function (e) { fail(e); });
}

function stopPlayer() {
  S.armed = false;
  haltAll(); PL.current = null;
  var p = S.now ? post('/api/stop', {}).then(pull, fail) : Promise.resolve();
  renderStageCtl();
  return p;
}

function syncPlayer() {
  if (!S.isHost || !S.playerOn || !S.armed) return;
  if (S.now && S.byId[S.now]) {
    if (PL.current !== S.now) playSong(S.now);
  } else {
    if (PL.current) { haltAll(); PL.current = null; }
    if (queueIds().length && !S.advancing) advance();
  }
}

function tileContent(iconName, key) {
  return [icon(iconName), h('span', { 'class': 'tl' }, h('small', { text: tOther(key) }), h('b', { text: t(key) }))];
}

function renderStageCtl() {
  $('#hostbar').hidden = !S.isHost;
  $('#hostbar p').hidden = S.playerOn;
  $('#hostbar').classList.toggle('compact', S.playerOn);
  $('#stage').hidden = !S.playerOn;
  $('#now').hidden = S.playerOn;
  $('#reqForm').hidden = S.playerOn;   // the host doesn't request songs from the player screen
  $('#joinRail').hidden = !S.playerOn;
  document.body.classList.toggle('stage-on', S.playerOn);
  $('#playerToggle').textContent = t(S.playerOn ? 'stopScreen' : 'useScreen');
  if (!S.playerOn) return;
  var q = queueSongs();
  var sb = $('#startBtn');
  sb.className = 'tile ' + (S.armed ? 'next' : 'start');
  setKids(sb, tileContent(S.armed ? 'next' : 'play', S.armed ? 'nextSong' : (S.now ? 'resumeParty' : 'startParty')));
  setKids($('#stopBtn'), tileContent('stop', 'stopPlay'));
  setKids($('#enlargeBtn'), tileContent(S.big ? 'shrink' : 'expand', S.big ? 'restoreSize' : 'enlarge'));
  $('#startBtn').disabled = S.armed && !S.now && q.length === 0;
  $('#stopBtn').hidden = !S.armed;
  $('#nextLine').textContent = q[0] ? t('nextLine', { title: q[0].title }) : t('nobodyNext');
  $('#idleMsg').textContent = t(S.armed ? 'idleWait' : 'idleStart');
  $('#stageCode').textContent = S.room;
  if (!PL.current) setLyric(null);
  fitBig();
}

/* progress fill on the lyric bar + Bilibili auto-advance timer */
setInterval(function () {
  if (S.big) fitBig();
  if (!S.playerOn || !PL.current) return;
  var p = null;
  try {
    if (PL.kind === 'youtube' && PL.yt && PL.yt.getDuration) {
      var d = PL.yt.getDuration(); if (d > 0) p = PL.yt.getCurrentTime() / d;
    } else if (PL.kind === 'file' && el.vid.duration) {
      p = el.vid.currentTime / el.vid.duration;
    } else if (PL.auto) {
      p = (Date.now() - PL.auto.startAt) / 1000 / PL.auto.dur;
      updateAutoRow();
      if (PL.auto.on && Date.now() >= PL.auto.endAt && PL.current === S.now) advance();
    }
  } catch (e) {}
  if (p == null || isNaN(p)) return;
  var l = $('#lyric');
  l.classList.remove('untracked');
  l.style.setProperty('--p', (Math.min(1, Math.max(0, p)) * 100).toFixed(1) + '%');
}, 400);

$('#autoPlus').addEventListener('click', function () { if (PL.auto) { PL.auto.endAt += 10000; updateAutoRow(); } });
$('#autoRestart').addEventListener('click', function () {
  if (PL.auto) { var n = Date.now(); PL.auto.startAt = n; PL.auto.endAt = n + (PL.auto.dur + 3) * 1000; updateAutoRow(); }
});
$('#autoToggle').addEventListener('click', function () { if (PL.auto) { PL.auto.on = !PL.auto.on; updateAutoRow(); } });

/* ---------- QR + invite ---------- */
function drawQR(target, text) {
  try {
    var qr = window.qrcode(0, 'M'); qr.addData(text); qr.make();
    target.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) { target.innerHTML = ''; }
}

function refreshStageQr() { if (S.room) drawQR($('#stageQr'), inviteUrl()); }

function openInvite() {
  var url = inviteUrl();
  $('#inviteCode').textContent = S.room;
  $('#inviteLink').textContent = url;
  drawQR($('#inviteQr'), url);
  var sel = $('#lanSel');
  var warn = $('#inviteWarn');
  if (S.lan.length > 1) {
    setKids(sel, S.lan.map(function (u, i) { var o = h('option', { value: i, text: u }); if (i === S.lanIdx) o.selected = true; return o; }));
    sel.hidden = false;
  } else sel.hidden = true;
  var localOnly = !S.lan.length;
  warn.hidden = !localOnly;
  warn.textContent = localOnly ? t('inviteNoLan') : '';
  $('#inviteHint').textContent = S.lan.length > 1 ? t('inviteAlt') : t('inviteHint');
  $('#invite').hidden = false;
}

$('#lanSel').addEventListener('change', function (e) { S.lanIdx = parseInt(e.target.value, 10) || 0; openInvite(); refreshStageQr(); });

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function (res, rej) {
    var ta = h('textarea', { readonly: true, style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); }
    document.body.removeChild(ta);
  });
}

/* ---------- wiring ---------- */
$('#joinForm').addEventListener('submit', function (e) { e.preventDefault(); handleLanding('join'); });
$('#createBtn').addEventListener('click', function () { handleLanding('create'); });
$('#openHostBtn').addEventListener('click', function () { handleLanding('open'); });
$('#inCode').addEventListener('input', function (e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });

$('#leaveBtn').addEventListener('click', function () { leaveRoom(false); });
$('#roomChip').addEventListener('click', openInvite);
$('#closeInvite').addEventListener('click', function () { $('#invite').hidden = true; });
$('#invite').addEventListener('click', function (e) { if (e.target === $('#invite')) $('#invite').hidden = true; });
$('#copyLink').addEventListener('click', function () {
  copyText(inviteUrl()).then(function () { toast(t('toastCopied')); }, function () { toast(t('toastCopyFail')); });
});

$('#reqForm').addEventListener('submit', function (e) { e.preventDefault(); addSong(); });
$('#reqLink').addEventListener('input', updateLinkHint);
$('#reqLink').addEventListener('change', autofillTitle);
$('#reqLink').addEventListener('paste', function () { setTimeout(function () { updateLinkHint(); autofillTitle(); }, 0); });
$('#sortVotes').addEventListener('click', sortByVotes);

$('#playerToggle').addEventListener('click', function () {
  if (S.playerOn) { setBig(false); stopPlayer(); S.playerOn = false; }
  else { S.playerOn = true; refreshStageQr(); }
  renderStageCtl();
});
$('#startBtn').addEventListener('click', function () {
  keepAwake();
  if (!S.armed) { S.armed = true; if (!S.now) advance(); syncPlayer(); }
  else advance();
  renderStageCtl();
});
$('#stopBtn').addEventListener('click', stopPlayer);
$('#enlargeBtn').addEventListener('click', function () { setBig(!S.big); });
$('#fbNext').addEventListener('click', advance);

/* ---------- boot ---------- */
(function boot() {
  var saved = store.get('ktv-name') || '';
  $('#inName').value = saved;
  var m = location.search.match(/[?&]r=([A-Za-z0-9]{3,6})/);
  if (m) $('#inCode').value = m[1].toUpperCase();
  applyLang();
  updateLinkHint();

  api('/api/info').then(function (info) {
    S.lan = info.lan || [];
    // if this page was opened through a network address, keep it as an option
    var here = location.origin;
    if (!/^https?:\/\/(localhost|127\.)/.test(here) && S.lan.indexOf(here) < 0) S.lan.unshift(here);
    if (S.room) refreshStageQr();
  }, function () {});

  // Returning guests and hosts, or anyone arriving from the QR code with a saved name, go straight in.
  if (m && saved) {
    S.name = saved;
    enterRoom(m[1]).catch(function (e) { landErr(errText(e.code)); });
  }
})();

})();
</script>
</body>
</html>
